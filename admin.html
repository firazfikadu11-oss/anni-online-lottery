/* =====================================================
   GET ACTIVE ROUND
===================================================== */

async function getActiveRound(){

  const {
    data:round,
    error
  } =
  await supabaseClient
  .from("rounds")
  .select("*")
  .eq(
    "status",
    "active"
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  )
  .limit(1)
  .maybeSingle();


  if(error){

    console.log(
      "Active round error:",
      error.message
    );

    return null;

  }


  return round || null;

}



/* =====================================================
   LOAD ACTIVE ROUND
===================================================== */

async function loadActiveRound(){

  const roundBox =
    document.getElementById(
      "roundBox"
    );


  const round =
    await getActiveRound();


  if(!round){

    roundBox.innerHTML = `

      <div class="round-title">
        ❌ Active round hin jiru
      </div>

    `;

    return null;

  }


  const {
    count,
    error:countError
  } =
  await supabaseClient
  .from("numbers")
  .select(
    "*",
    {
      count:"exact",
      head:true
    }
  )
  .eq(
    "status",
    "confirmed"
  )
  .eq(
    "round_id",
    round.id
  );


  if(countError){

    console.log(
      countError
    );

    return round;

  }


  roundBox.innerHTML = `

    <div class="round-title">

      🏆 Round
      ${escapeHTML(
        round.round_number
      )}

    </div>


    <div class="round-count">

      ${count || 0} / 100

    </div>


    <div>

      ${
        count === 100
        ?
        "✅ Number 100 guutameera. Draw gochuu dandeessa."
        :
        "⏳ Number 100 guutamuu qaba."
      }

    </div>

  `;


  return round;

}



/* =====================================================
   GET TICKET LIST
===================================================== */

function getTicketList(receipt){

  if(
    receipt &&
    receipt.ticket_numbers &&
    String(
      receipt.ticket_numbers
    ).trim()
  ){

    return String(
      receipt.ticket_numbers
    )
    .split(",")
    .map(
      x =>
        Number(
          x.trim()
        )
    )
    .filter(
      x =>
        Number.isInteger(x) &&
        x >= 1 &&
        x <= 100
    );

  }


  if(
    receipt &&
    receipt.number !== null &&
    receipt.number !== undefined
  ){

    const n =
      Number(
        receipt.number
      );


    if(
      Number.isInteger(n) &&
      n >= 1 &&
      n <= 100
    ){

      return [n];

    }

  }


  return [];

}

/* =====================================================
   LOAD RECEIPTS
===================================================== */

async function loadReceipts(){

  const box =
    document.getElementById(
      "receipts"
    );


  const message =
    document.getElementById(
      "message"
    );


  box.innerHTML = `

    <div class="loading">
      ⏳ Receiptwwan barbaadaa jira...
    </div>

  `;


  message.innerHTML = "";


  await releaseExpiredNumbers();


  await loadActiveRound();


  const {
    data,
    error
  } =
  await supabaseClient
  .from("receipts")
  .select("*")
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    console.log(
      error
    );


    box.innerHTML = `

      <div class="empty">

        ❌ Receiptwwan fiduu hin dandeenye.

      </div>

    `;


    message.innerHTML =
      "Database error: " +
      escapeHTML(
        error.message
      );


    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    box.innerHTML = `

      <div class="empty">

        📭 Receipt hin jiru.

      </div>

    `;


    return;

  }


  box.innerHTML = "";


  data.forEach(
    receipt => {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      /* IMAGE */

      let imageUrl =
        receipt.image_url || "";


      if(
        imageUrl &&
        !imageUrl.startsWith(
          "http"
        )
      ){

        const {
          data:urlData
        } =
        supabaseClient
        .storage
        .from("receipts")
        .getPublicUrl(
          imageUrl
        );


        if(urlData){

          imageUrl =
            urlData.publicUrl;

        }

      }


      /* STATUS */

      const status =
        receipt.status ||
        "pending";


      let statusClass =
        "pending";


      if(
        status === "approved"
      ){

        statusClass =
          "approved";

      }


      if(
        status === "rejected"
      ){

        statusClass =
          "rejected";

      }


      /* DATE */

      let createdText =
        "";


      if(
        receipt.created_at
      ){

        try{

          createdText =
            new Date(
              receipt.created_at
            ).toLocaleString();

        }catch(e){

          createdText =
            receipt.created_at;

        }

      }


      /* TICKETS */

      const ticketList =
        getTicketList(
          receipt
        );


      const ticketText =
        ticketList.length > 0
        ?
        ticketList.join(", ")
        :
        "-";


      /* IMAGE HTML */

      let imageHTML =
        "";


      if(imageUrl){

        imageHTML = `

          <img
            class="receipt-image"
            src="${escapeHTML(
              imageUrl
            )}"
            alt="Receipt"

            onclick="
              window.open(
                this.src,
                '_blank'
              )
            "

          >

        `;

      }else{

        imageHTML = `

          <div
            style="
              background:#eee;
              padding:30px;
              text-align:center;
              border-radius:12px;
              margin-top:12px;
            "
          >

            📷 Receipt image hin jiru

          </div>

        `;

      }


      /* BUTTONS */

      let buttonsHTML =
        "";


      if(
        status === "pending"
      ){

        buttonsHTML = `

          <div class="buttons">

            <button
              class="approve"
              onclick="approve(
                ${receipt.id}
              )"
            >

              ✅ Approve

            </button>


            <button
              class="reject"
              onclick="rejectReceipt(
                ${receipt.id}
              )"
            >

              ❌ Reject

            </button>


            <button
              class="delete"
              onclick="deleteReceipt(
                ${receipt.id},
                '${escapeJS(
                  receipt.image_url || ""
                )}'
              )"
            >

              🗑️ Delete

            </button>

          </div>

        `;

      }else{

        buttonsHTML = `

          <div class="buttons">

            <button
              class="delete"
              onclick="deleteReceipt(
                ${receipt.id},
                '${escapeJS(
                  receipt.image_url || ""
                )}'
              )"
            >

              🗑️ Delete

            </button>

          </div>

        `;

      }


      /* CARD */

      card.innerHTML = `

        <div class="select-row">

          <input
            type="checkbox"
            class="receipt-select"
            value="${receipt.id}"
            id="receipt-${receipt.id}"
          >

          <label
            for="receipt-${receipt.id}"
          >

            ☑️ Select Receipt

          </label>

        </div>


        <div class="info">

          <div class="ticket-list">

            🎟 Ticket:
            ${escapeHTML(
              ticketText
            )}

          </div>


          <div>

            <b>👤 Maqaa:</b>

            ${escapeHTML(
              receipt.user_name ??
              "-"
            )}

          </div>


          <div>

            <b>📱 Phone:</b>

            ${escapeHTML(
              receipt.phone ??
              "-"
            )}

          </div>


          <div>

            <b>Status:</b>

            <span
              class="status ${statusClass}"
            >

              ${escapeHTML(
                status
              )}

            </span>

          </div>


          ${
            createdText
            ?
            `
              <div class="time">

                🕒
                ${escapeHTML(
                  createdText
                )}

              </div>
            `
            :
            ""
          }

        </div>


        ${imageHTML}


        ${buttonsHTML}

      `;


      box.appendChild(
        card
      );

    }
  );

}



/* =====================================================
   APPROVE RECEIPT
===================================================== */

async function approve(id){

  const ok =
    confirm(
      "Receipt kana approve gochuu barbaaddaa?"
    );


  if(!ok) return;


  const activeRound =
    await getActiveRound();


  if(!activeRound){

    alert(
      "❌ Active round hin jiru."
    );

    return;

  }


  const {
    data:receipt,
    error:receiptError
  } =
  await supabaseClient
  .from("receipts")
  .select(
    "id,user_name,phone,number,ticket_numbers,status"
  )
  .eq(
    "id",
    id
  )
  .maybeSingle();


  if(
    receiptError ||
    !receipt
  ){

    alert(
      "❌ Receipt argachuu hin dandeenye.\n\n" +
      (
        receiptError?.message ||
        ""
      )
    );

    return;

  }


  if(
    receipt.status !==
    "pending"
  ){

    alert(
      "⚠️ Receipt kun duraan " +
      receipt.status +
      " dha."
    );

    return;

  }


  const ownerName =
    receipt.user_name
    ?
    String(
      receipt.user_name
    ).trim()
    :
    "";


  if(!ownerName){

    alert(
      "❌ Maqaan namaa hin jiru."
    );

    return;

  }


  const ticketList =
    getTicketList(
      receipt
    );


  if(
    ticketList.length === 0
  ){

    alert(
      "❌ Ticket number hin argamne."
    );

    return;

  }


  if(
    ticketList.length > 5
  ){

    alert(
      "❌ Ticket 5 ol hin hayyamamu."
    );

    return;

  }


  const {
    data:numbers,
    error:numberFetchError
  } =
  await supabaseClient
  .from("numbers")
  .select(
    "number,status,round_id"
  )
  .in(
    "number",
    ticketList
  );


  if(numberFetchError){

    alert(
      "❌ Numbers fiduu hin dandeenye.\n\n" +
      numberFetchError.message
    );

    return;

  }


  if(
    !numbers ||
    numbers.length !==
    ticketList.length
  ){

    alert(
      "❌ Ticket number tokko tokko hin argamne."
    );

    return;

  }


  for(
    const ticket of ticketList
  ){

    const row =
      numbers.find(
        n =>
          Number(
            n.number
          ) === ticket
      );


    if(!row){

      alert(
        "❌ Number " +
        ticket +
        " hin argamne."
      );

      return;

    }


    if(
      String(
        row.round_id
      ) !==
      String(
        activeRound.id
      )
    ){

      alert(
        "❌ Number " +
        ticket +
        " Round " +
        activeRound.round_number +
        " keessa miti."
      );

      return;

    }


    if(
      row.status !==
      "pending"
    ){

      alert(
        "❌ Number " +
        ticket +
        " pending miti.\n\n" +
        "Status: " +
        row.status
      );

      return;

    }

  }


  /* APPROVE RECEIPT */

  const {
    error:approveError
  } =
  await supabaseClient
  .from("receipts")
  .update({
    status:"approved"
  })
  .eq(
    "id",
    id
  );


  if(approveError){

    alert(
      "❌ Receipt approve hin taane.\n\n" +
      approveError.message
    );

    return;

  }


  /* UPDATE NUMBERS */

  let updateError =
    null;


  for(
    const ticket of ticketList
  ){

    const {
      error
    } =
    await supabaseClient
    .from("numbers")
    .update({

      status:
        "confirmed",

      pending_until:
        null,

      round_id:
        activeRound.id,

      owner_name:
        ownerName

    })
    .eq(
      "number",
      ticket
    )
    .eq(
      "round_id",
      activeRound.id
    );


    if(error){

      updateError =
        error;

      break;

    }

  }


  if(updateError){

    alert(
      "⚠️ Receipt approved ta'eera, garuu number update hin taane.\n\n" +
      updateError.message
    );

    console.log(
      updateError
    );

    return;

  }


  alert(
    "✅ Receipt Approved!\n\n" +

    "🎟 Ticket: " +
    ticketList.join(", ") +

    "\n👤 Maqaa: " +
    ownerName +

    "\n\nNumber hundi confirmed ta'eera."
  );


  await loadReceipts();

}



/* =====================================================
   REJECT RECEIPT
===================================================== */

async function rejectReceipt(id){

  const ok =
    confirm(
      "Receipt kana reject gochuu barbaaddaa?"
    );


  if(!ok) return;


  const {
    data:receipt,
    error:receiptFetchError
  } =
  await supabaseClient
  .from("receipts")
  .select(
    "id,number,ticket_numbers,status"
  )
  .eq(
    "id",
    id
  )
  .maybeSingle();


  if(
    receiptFetchError ||
    !receipt
  ){

    alert(
      "❌ Receipt argachuu hin dandeenye."
    );

    return;

  }


  if(
    receipt.status !==
    "pending"
  ){

    alert(
      "⚠️ Receipt kun duraan " +
      receipt.status +
      " dha."
    );

    return;

  }


  const ticketList =
    getTicketList(
      receipt
    );


  if(
    ticketList.length === 0
  ){

    alert(
      "❌ Ticket number hin argamne."
    );

    return;

  }


  const {
    error:receiptError
  } =
  await supabaseClient
  .from("receipts")
  .update({
    status:
      "rejected"
  })
  .eq(
    "id",
    id
  );


  if(receiptError){

    alert(
      "❌ Receipt reject hin taane.\n\n" +
      receiptError.message
    );

    return;

  }


  for(
    const ticket of ticketList
  ){

    const {
      error
    } =
    await supabaseClient
    .from("numbers")
    .update({

      status:
        "available",

      pending_until:
        null

    })
    .eq(
      "number",
      ticket
    )
    .eq(
      "status",
      "pending"
    );


    if(error){

      console.log(
        "Reject release error:",
        ticket,
        error.message
      );

    }

  }


  alert(
    "❌ Receipt rejected.\n\n" +

    "🎟 Ticket: " +
    ticketList.join(", ") +

    "\n\nAvailable deebi'eera."
  );


  await loadReceipts();

}

  const imageUrl =
    image ||

  if(imageUrl){

    try{

      const marker =
        "/storage/v1/object/public/receipts/";


      const index =
        imageUrl.indexOf(
          marker
        );


      if(index !== -1){

        const filePath =
          decodeURIComponent(
            imageUrl.substring(
              index +
              marker.length
            )
          );


        if(filePath){

          const {
            error:storageError
          } =
          await supabaseClient
          .storage
          .from("receipts")
          .remove([

          ]);


          if(storageError){

            console.log(
              "Storage delete error:",
              storageError.message
            );

          }

        }

      }

    }catch(error){

      console.log(
        "Image delete error:",
        error
      );

    }

  /* RELEASE PENDING */

  for(
    const ticket of ticketList

      "status",
      "pending"
    );

/* =====================================================
   RELEASE EXPIRED NUMBERS
===================================================== */

async function releaseExpiredNumbers(){

  const now =
    new Date()
    .toISOString();


  const {
    data,
    error
  } =
  await supabaseClient
  .from("numbers")
  .select(
    "id,number,pending_until"
  )
  .eq(
    "status",
    "pending"
  )
  .not(
    "pending_until",
    "is",
    null
  )
  .lt(
    "pending_until",
    now
  );


  if(error){

    console.log(
      "Release expired error:",
      error.message
    );

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    return;

  }


  for(
    const item of data
  ){

    const {
      error:updateError
    } =
    await supabaseClient
    .from("numbers")
    .update({

      status:
        "available",

      pending_until:
        null

    })
    .eq(
      "id",
      item.id
    )
    .eq(
      "status",
      "pending"
    );


    if(updateError){

      console.log(
        "Expired number update error:",
        item.number,
        updateError.message
      );

    }

  }


  console.log(
    "✅ Expired numbers released:",
    data.length
  );

}



/* =====================================================
   DRAW ROUND
===================================================== */

async function finishRound(){

  const ok =
    confirm(
      "🏆 Draw Winner gochuu barbaaddaa?"
    );


  if(!ok) return;


  /* ACTIVE ROUND */

  const round =
    await getActiveRound();


  if(!round){

    alert(
      "❌ Active round hin jiru."
    );

    return;

  }


  /* COUNT 100 */

  const {
    count,
    error:countError
  } =
  await supabaseClient
  .from("numbers")
  .select(
    "*",
    {
      count:"exact",
      head:true
    }
  )
  .eq(
    "status",
    "confirmed"
  )
  .eq(
    "round_id",
    round.id
  );


  if(countError){

    alert(
      "❌ Count error:\n\n" +
      countError.message
    );

    return;

  }


  if(count !== 100){

    alert(

      "⛔ Draw hin danda'amu.\n\n" +

      "Confirmed: " +
      (count || 0) +
      "/100"

    );

    return;

  }


  /* GET 100 NUMBERS */

  const {
    data:numbers,
    error:numberError
  } =
  await supabaseClient
  .from("numbers")
  .select(
    "number,owner_name"
  )
  .eq(
    "status",
    "confirmed"
  )
  .eq(
    "round_id",
    round.id
  );


  if(
    numberError ||
    !numbers ||
    numbers.length !== 100
  ){

    alert(
      "❌ Numbers 100 argachuu hin dandeenye."
    );

    return;

  }


  /* RANDOM SHUFFLE */

  for(
    let i =
      numbers.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      numbers[i],
      numbers[j]
    ] =
    [
      numbers[j],
      numbers[i]
    ];

  }


  /* WINNERS */

  const winners = [

    {
      position:1,

      number:
        numbers[0].number,

      prize:10000,

      name:
        numbers[0].owner_name ||
        null

    },

    {
      position:2,

      number:
        numbers[1].number,

      prize:2000,

      name:
        numbers[1].owner_name ||
        null

    },

    {
      position:3,

      number:
        numbers[2].number,

      prize:1000,

      name:
        numbers[2].owner_name ||
        null

    }

  ];


  /* SAVE WINNER HISTORY */

  for(
    const w of winners
  ){

    let winnerPhone =
      null;


    const {
      data:receipts,
      error:receiptError
    } =
    await supabaseClient
    .from("receipts")
    .select(
      "user_name,phone,number,ticket_numbers,status,created_at"
    )
    .eq(
      "status",
      "approved"
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


    if(
      !receiptError &&
      receipts
    ){

      const winnerReceipt =
        receipts.find(
          r => {

            const list =
              getTicketList(
                r
              );

            return list.includes(
              Number(
                w.number
              )
            );

          }
        );


      if(winnerReceipt){

        winnerPhone =
          winnerReceipt.phone ||
          null;

      }

    }


    const {
      error:historyError
    } =
    await supabaseClient
    .from("winner_history")
    .insert({

      round_id:
        round.id,

      round_number:
        round.round_number,

      winner_number:
        w.number,

      winner_position:
        w.position,

      prize:
        w.prize,

      winner_name:
        w.name,

      winner_phone:
        winnerPhone

    });


    if(historyError){

      alert(
        "❌ Winner history save hin taane.\n\n" +
        historyError.message
      );

      console.log(
        historyError
      );

      return;

    }

  }


  /* FINISH OLD ROUND */

  const {
    error:finishError
  } =
  await supabaseClient
  .from("rounds")
  .update({

    status:
      "finished",

    winner_number:
      winners[0].number,

    finished_at:
      new Date().toISOString()

  })
  .eq(
    "id",
    round.id
  );


  if(finishError){

    alert(
      "❌ Round finish hin taane.\n\n" +
      finishError.message
    );

    return;

  }


  /* CREATE NEW ROUND */

  const {
    data:newRound,
    error:newRoundError
  } =
  await supabaseClient
  .from("rounds")
  .insert({

    round_number:
      Number(
        round.round_number
      ) + 1,

    status:
      "active"

  })
  .select()
  .single();


  if(
    newRoundError ||
    !newRound
  ){

    alert(
      "⚠️ Round haaraa uumuu hin dandeenye.\n\n" +
      (
        newRoundError?.message ||
        ""
      )
    );

    return;

  }


  /* RESET NUMBERS */

  const {
    error:resetError
  } =
  await supabaseClient
  .from("numbers")
  .update({

    round_id:
      newRound.id,

    status:
      "available",

    pending_until:
      null,

    owner_name:
      null

  })
  .eq(
    "round_id",
    round.id
  );


  if(resetError){

    alert(
      "⚠️ Round haaraan uumameera, garuu numbers reset hin taane.\n\n" +
      resetError.message
    );

    console.log(
      resetError
    );

    return;

  }


  /* SHOW WINNERS */

  const winnerBox =
    document.getElementById(
      "winnerBox"
    );


  winnerBox.style.display =
    "block";


  winnerBox.innerHTML = `

    <h2>🏆 DRAW RESULT</h2>


    <div class="winner-row">

      🥇 1st

      — Number
      ${escapeHTML(
        winners[0].number
      )}

      ${
        winners[0].name
        ?
        " — " +
        escapeHTML(
          winners[0].name
        )
        :
        ""
      }

      — 10,000 Birr

    </div>


    <div class="winner-row">

      🥈 2nd

      — Number
      ${escapeHTML(
        winners[1].number
      )}

      ${
        winners[1].name
        ?
        " — " +
        escapeHTML(
          winners[1].name
        )
        :
        ""
      }

      — 2,000 Birr

    </div>


    <div class="winner-row">

      🥉 3rd

      — Number
      ${escapeHTML(
        winners[2].number
      )}

      ${
        winners[2].name
        ?
        " — " +
        escapeHTML(
          winners[2].name
        )
        :
        ""
      }

      — 1,000 Birr

    </div>

  `;


  alert(

    "🏆 Draw xumurameera!\n\n" +

    "🥇 " +
    winners[0].number +
    " = 10,000 Birr\n" +

    "🥈 " +
    winners[1].number +
    " = 2,000 Birr\n" +

    "🥉 " +
    winners[2].number +
    " = 1,000 Birr"

  );


  await loadReceipts();

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJS(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /\r/g,
      "\\r"
    )

    .replace(
      /\n/g,
      "\\n"
    );

}

setInterval(
